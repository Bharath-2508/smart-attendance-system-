version: '3.8'

services:
  backend:
    build: ./backend
    container_name: bus-attendance-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=bus-attendance-secret-key-2024
    restart: unless-stopped
    networks:
      - bus-network

  frontend:
    build: ./frontend
    container_name: bus-attendance-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - bus-network

networks:
  bus-network:
    driver: bridge
